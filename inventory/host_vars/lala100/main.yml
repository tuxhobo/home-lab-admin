# inventory/host_vars/lala100/main.yml

ansible_python_interpreter: /usr/bin/python3

# PVE host specific variables constant over all vms
pve_node: https://10.0.0.100
pve_host: lala100

# PVE host variables for the vm template
# image_staging_dir: /var/lib/vz/template/images
qcow2_staging_dir:  /var/lib/vz/template/qcow2
template_id: 9000
template_cores: 2
template_memory: 1024
template_net0: "virtio,bridge=vmbr0"
template_ide2: "local:cloudinit"
template_ostype: l26
template_scsihw: virtio-scsi-pci
template_sata0: "local:9000/vm-9000-disk-0.qcow2"
template_ciuser: admin
cipassword: "{{ vault_root_password }}"
template_dir: /var/lib/vz/template
state: present


virtual_machines:
  lala101:
    vm_id: 1100101
    vm_name: lala101
    vm_start_at_boot: true
    vm_shutdown_order: any         # <- Not directly supported by qm, may be used for orchestrated shutdowns
    vm_startup_delay: default      # <- Not a qm param unless used in `--startdelay`
    
    Storage: local-lvm
    Guest_OS_Type: l26              # l26 = Linux 2.6/3.x/4.x/5.x/6.x
    Guest_OS_Version: 6x-2.6 Kernel # <- Informational only; remove unless you use it somewhere else

    machine: q35
    SCSI_Controller: virtio-scsi-single
    Qemu_agent: false
    BIOS: seabios                    # seabios or ovmf

    Bus_Device: scsi                # Use this lowercase string in `qm set`
    Disk_Size(GB): 32
    Format: qcow2                   # Use this as `--format qcow2` in `qm importdisk`

    Backup: true
    Backup_storage: Backup2lala120

    cpu_sockets: 1
    cpu_cores: 4
    cpu_type: host

    bridge: vmbr0

    image_url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2
    image_name: debian-12-generic-amd64.qcow2

#    image_url: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
#    image_name: ubuntu-24.04-minimal-cloudimg-amd64.img

mount_sets:
  paperless-ngx:
    nfs:
      src: 10.0.0.110:/mnt/atl/home/docker/paperless-ngx
      dest: /mnt/lala110/paperless-ngx
      fstype: nfs
      comment: "NFS share to mount on proxmox host"
    lxc_bind:
      container_name: lala115
      source: /mnt/lala110/paperless-ngx
      target: /mnt/paperless-ngx
      owner: admin
      group: admin
      mode: '0775'
      comment: bind location in lxc container and user

linux_bonds:
  bond0:
    comment: "Replication bond"
    slaves: "eno2 eno3 eno4"
    mode: balance-xor
    hash_policy: layer3+4

linux_bridges:
  vmbr1:
    IPv4_CIDR: 10.100.150.1/28
    auto_start: true
    bridge_ports: "bond0"
    comment: "Replication bridge"


containers:
  lala107:
    lxc_id: 1150107
    node_addr: 10.0.0.107


